name: Agent Sheen

on:
  schedule:
    - cron: "3-58/5 * * * *"      # every 5 min (GitHub's minimum), off the busy :00/:05 marks so runs start sooner
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the logins only, dry-run = decide but send nothing, run = normal"
        type: choice
        default: run
        options: [run, dry-run, check]

# One run at a time: a second run waits instead of racing the first.
concurrency:
  group: agent-sheen
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                  # only used by the keep-alive step at the end

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore state (remembers which mail was already handled)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: Answer new mail
        id: respond
        env:
          ICLOUD_ADDRESS: ${{ vars.ICLOUD_ADDRESS }}
          ICLOUD_LOGIN: ${{ vars.ICLOUD_LOGIN }}
          IGNORE_BEFORE: ${{ vars.IGNORE_BEFORE }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          mkdir -p .state
          before=$(cat .state/state.json 2>/dev/null | sha1sum)
          set +e
          case "$MODE" in
            check)   python responder.py check ;;
            dry-run) python responder.py run --dry-run ;;
            *)       python responder.py run ;;
          esac
          code=$?
          after=$(cat .state/state.json 2>/dev/null | sha1sum)
          [ "$before" != "$after" ] && echo "changed=true" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Save state
        if: always() && steps.respond.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub switches scheduled workflows off after 60 days without repository activity.
      # Re-enabling the workflow each run is the usual way to keep it alive (best effort).
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/agent-sheen.yml/enable"
